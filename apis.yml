name: QiDZ Holding
description: >-
  QiDZ Holding operates theQapp (formerly QiDZ), a consumer mobile platform that
  helps families discover, compare, and book activities, entertainment, and dining
  experiences across the United Arab Emirates and the wider Middle East (Dubai, Abu
  Dhabi, Riyadh, Jeddah, Eastern Province, Manama, and Cairo). The app curates theme
  parks, water parks, indoor play areas, sports and creative classes, kid-friendly
  restaurants, camps, staycations, museums, and birthday and event packages, and
  offers a Q-Club membership with exclusive promo codes and discounts. Backed by 500
  Global, QiDZ is a B2C mobile experience distributed through the Apple App Store and
  Google Play; it exposes no public developer API, developer portal, or machine
  specification, so this profile captures its identity and a domain-security probe
  rather than API artifacts.
